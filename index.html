<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лифт — засели дом</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #e0ecf3; color: #4b4036; font-family: Arial, sans-serif; }
  button { font: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:disabled { cursor: default; }
  button:focus-visible { outline: 4px solid #467590; outline-offset: 5px; }
  [hidden] { display: none !important; }
  #viewport { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1672px; height: 940.5px; transform-origin: center; overflow: hidden; isolation: isolate; user-select: none; }
  #background { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .art { position: absolute; overflow: hidden; pointer-events: none; }
  .art img { position: absolute; max-width: none; pointer-events: none; }
  #panel { left: 40px; top: 58px; width: 144px; height: 825px; z-index: 7; }
  #bulb { position: absolute; left: 62px; top: 92px; width: 100px; height: 127px; padding: 0; background: none; border: 0; z-index: 9; }
  #bulbArt { inset: 0; }
  #glow { width: 185px; height: 185px; left: -42px; top: -31px; opacity: 0; }
  #bulb.pulse #glow { animation: glow 2.2s ease-in-out infinite; }
  .floorButton { position: absolute; left: 64px; width: 96px; height: 96px; border: 0; border-radius: 50%; padding: 0; background: none; z-index: 9; color: #514337; font-size: 46px; font-weight: 600; display: grid; place-items: center; }
  .floorButton .art { inset: 0; }
  .floorButton span { position: relative; line-height: 1; }
  .floorButton:hover:not(:disabled) { filter: brightness(1.06); }
  .floorButton:active:not(:disabled) { transform: scale(.96); }
  .floorButton.selected { color: #426346; filter: brightness(1.08); }
  .floorButton.shake { animation: shake .45s ease-in-out; }
  .floorLabel { position: absolute; left: 371px; width: 45px; line-height: 47px; text-align: center; border: 2px solid #d7b88d; border-radius: 10px; background: #fff1d5; color: #564637; font-size: 38px; font-weight: 700; z-index: 1; }
  .liftPart { position: absolute; left: 229px; top: 0; width: 130px; height: 130px; will-change: transform; pointer-events: none; }
  #cabinBack { z-index: 2; }
  #cabinBack > .art, #frame { inset: 0; }
  #cabinFront { z-index: 4; }
  #doorClip { position: absolute; inset: 5px; overflow: hidden; }
  .door { top: 0; bottom: 0; width: 50%; will-change: transform; }
  #leftDoor { left: 0; }
  #rightDoor { right: 0; }
  #frame { z-index: 2; }
  .hero { position: absolute; left: 0; top: 0; width: 110px; height: 110px; z-index: 3; opacity: 0; pointer-events: none; will-change: transform; }
  .hero.foreground { z-index: 5; }
  .hero img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; max-width: none; }
  .heroShadow { position: absolute; left: 0; top: 0; width: 67px; height: 6px; border-radius: 50%; background: #694a343e; filter: blur(2px); z-index: 2; pointer-events: none; opacity: 0; }
  .roomLight { position: absolute; left: 427px; top: 490px; width: 532px; height: 142px; background: radial-gradient(ellipse at 50% 90%, #ffe19377, transparent 75%); z-index: 1; opacity: 0; transition: opacity 1s; pointer-events: none; }
  #intro { position: absolute; left: 1060px; top: 250px; width: 545px; text-align: center; color: #425263; }
  .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 3px; color: #8c6945; margin: 0 0 23px; }
  #intro h1 { font-size: 46px; line-height: 1.16; margin: 0 0 30px; }
  #intro > p:last-child { font-size: 27px; line-height: 1.5; margin: 0; }
  .card { position: absolute; left: 1050px; top: 225px; width: 563px; height: 437px; z-index: 10; }
  .cardArt { inset: 0; }
  .cardContent { position: absolute; inset: 51px 47px 39px; text-align: center; }
  .card .eyebrow { font-size: 16px; margin-bottom: 20px; }
  .card h2 { font-size: 35px; line-height: 1.15; margin: 0 0 27px; }
  .condition { font-size: 31px; line-height: 1.45; margin: 0; }
  .cardHint { font-size: 19px; color: #89715b; margin: 25px 0 0; }
  #closeHint { position: absolute; top: 20px; right: 23px; width: 43px; height: 43px; border: 0; background: none; border-radius: 50%; color: #8b6645; font-size: 37px; line-height: 1; z-index: 2; }
  .action { margin-top: 26px; padding: 16px 24px; border: 1px solid #bd9252; border-radius: 18px; background: #ffefd0; box-shadow: 0 3px 0 #c8a56d; color: #654629; font-size: 23px; font-weight: 600; }
  .action:hover { background: #ffe4b2; }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #e3f0f5f5; z-index: 20; font-size: 28px; text-align: center; padding: 100px; }
  #loadDetails { font-size: 20px; line-height: 1.5; }
  .srOnly { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @keyframes glow { 0%,100% { opacity: .09; transform: scale(.92); } 50% { opacity: .3; transform: scale(1.06); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  @media (prefers-reduced-motion: reduce) { #bulb.pulse #glow { animation: none; opacity: .2; } .floorButton.shake { animation: none; } }

  .roomLight { height: 120px; }
  .floorLabel.occupied { background:#fff5bc; border-color:#c69b48; }
  .card h2 { font-size:32px; margin-bottom:20px; }
  .condition { font-size:29px; line-height:1.4; }
  .cardHint { margin-top:18px; }
  #sparkles { position:absolute; inset:0; pointer-events:none; z-index:6; }
  .sparkle { position:absolute; color:#e4ac38; font-size:25px; animation:twinkle 1.5s ease-in-out 3 alternate; }
  @keyframes twinkle { from {opacity:0; transform:scale(.4) rotate(0deg);} to {opacity:1; transform:scale(1) rotate(30deg);} }
  @media(prefers-reduced-motion:reduce) {.sparkle {animation:none;} .roomLight {transition:none;} }
  .parcel {position:absolute;left:0;top:0;width:76px;height:76px;z-index:3;pointer-events:none;}
  .parcel.foreground {z-index:5;}
  .parcel img {width:100%;height:100%;}
</style>
</head>
<body>
<main id="viewport" aria-label="Логическая игра Лифт">
  <div id="stage" data-phase="loading">
    <img id="background" src="./lift-background-v1.png" alt="Дом с шестью этажами, лифтом слева и открытыми квартирами">
    
    <div id="cabinBack" class="liftPart" aria-hidden="true"><div id="interior" class="art"></div></div>
    
    
    <div id="cabinFront" class="liftPart" aria-hidden="true">
      <div id="doorClip"><div id="leftDoor" class="door art"></div><div id="rightDoor" class="door art"></div></div>
      <div id="frame" class="art"></div>
    </div>
    <div id="floorLabels" aria-hidden="true"></div>
    <div id="panel" class="art" aria-hidden="true"></div>
    <button id="bulb" aria-label="Открыть подсказку" aria-controls="instruction" aria-expanded="false" disabled>
      <span id="glow" class="art" aria-hidden="true"></span><span id="bulbArt" class="art" aria-hidden="true"></span>
    </button>
    <div id="buttons" role="group" aria-label="Выберите этаж"></div>
    <div id="intro"><p class="eyebrow" id="progress">ЛИФТ · 0 ИЗ 6 ДОМА</p><h1>Помоги жителям<br>найти свой дом</h1><p>Нажми на лампочку,<br>чтобы прочитать подсказку.</p></div>
    <section id="instruction" class="card" aria-labelledby="hintTitle" hidden>
      <div class="cardArt art" aria-hidden="true"></div>
      
      <div class="cardContent"><p class="eyebrow" id="hintNumber">ЖИТЕЛЬ 1 ИЗ 6</p><h2 id="hintTitle">Где живёт кот?</h2><p class="condition" id="condition"></p><p class="cardHint">Выбери кнопку нужного этажа.</p></div>
    </section>
    <section id="success" class="card" aria-labelledby="successTitle" hidden>
      <div class="cardArt art" aria-hidden="true"></div>
      <div class="cardContent"><p class="eyebrow">ПОЛУЧИЛОСЬ!</p><h2 id="successTitle">Дом заселён!</h2><p class="condition">Все шесть друзей<br>нашли свои квартиры!</p><button id="nextSlide" class="action" hidden>Доставить посылки →</button><button id="restart" class="action">Играть ещё раз ↻</button></div>
    </section>
    <div id="sparkles" aria-hidden="true" hidden></div><p id="status" class="srOnly" role="status" aria-live="polite"></p>
    <div id="loading" role="status"><p id="loadTitle">Загружаем дом…</p><p id="loadDetails"></p><button id="retry" class="action" hidden>Попробовать ещё раз</button></div>
  </div>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const asset = name => `./lift-${name}-v1.png`;
  const ART = {
    panel: ['control-panel', [946,1662], [303,72,643,1593]],
    bulb: ['bulb', [1254,1254], [276,129,978,1131]],
    glow: ['bulb-glow', [1254,1254], [0,0,1254,1254]],
    button: ['floor-button', [1254,1254], [146,131,1107,1093]],
    interior: ['cabin-interior', [1312,1199], [174,147,1140,1050]],
    frame: ['cabin-frame', [1292,1218], [86,83,1207,1120]],
    left: ['door-left', [887,1774], [135,90,753,1685]],
    right: ['door-right', [887,1774], [129,88,758,1684]],
    card: ['instruction-card', [1345,1170], [38,107,1310,1058]]
  };
  function art(element, key) {
    const [name,[w,h],[l,t,r,b]] = ART[key];
    const img = new Image(); img.alt = ''; img.draggable = false; img.src = asset(name);
    Object.assign(img.style, {width:`${100*w/(r-l)}%`, height:`${100*h/(b-t)}%`, left:`${-100*l/(r-l)}%`, top:`${-100*t/(b-t)}%`});
    element.append(img);
  }
  [['panel','panel'],['bulbArt','bulb'],['glow','glow'],['interior','interior'],['frame','frame'],['leftDoor','left'],['rightDoor','right']].forEach(([id,key]) => art($(id),key));
  document.querySelectorAll('.cardArt').forEach(el => art(el,'card'));

  const PEOPLE = [
  {
    "id": "cat",
    "name": "Кот",
    "floor": 3,
    "hint": "Кот живёт между первым и четвёртым этажами, но не на втором.",
    "version": 1,
    "size": 110,
    "speed": 76,
    "step": 12,
    "feet": [
      1179,
      1169,
      1168,
      1170,
      1183,
      1183
    ]
  },
  {
    "id": "rabbit",
    "name": "Зайчик",
    "floor": 4,
    "hint": "Зайчик живёт на один этаж выше кота.",
    "version": 1,
    "size": 110,
    "speed": 76,
    "step": 12,
    "feet": [
      1202,
      1199,
      1193,
      1188,
      1206,
      1206
    ]
  },
  {
    "id": "fox",
    "name": "Лиса",
    "floor": 6,
    "hint": "Лиса живёт на два этажа выше зайчика.",
    "version": 1,
    "size": 110,
    "speed": 76,
    "step": 12,
    "feet": [
      1180,
      1179,
      1166,
      1180,
      1176,
      1186
    ]
  },
  {
    "id": "bear",
    "name": "Медвежонок",
    "floor": 2,
    "hint": "Медвежонок живёт ниже кота, но не на первом этаже.",
    "version": 2,
    "size": 110,
    "speed": 64,
    "step": 12,
    "feet": [
      1159,
      1149,
      1127,
      1129,
      1159,
      1157
    ]
  },
  {
    "id": "dog",
    "name": "Собака",
    "floor": 5,
    "hint": "Собака живёт выше зайчика, но ниже лисы.",
    "version": 1,
    "size": 110,
    "speed": 76,
    "step": 12,
    "feet": [
      1161,
      1161,
      1128,
      1137,
      1168,
      1178
    ]
  },
  {
    "id": "hedgehog",
    "name": "Ёжик",
    "floor": 1,
    "hint": "Ёжик живёт ниже кота, но не по соседству с котом.",
    "version": 1,
    "size": 100,
    "speed": 64,
    "step": 10,
    "feet": [
      1087,
      1065,
      1086,
      1086,
      1063,
      1092
    ]
  }
];
  const FLOOR_Y=[901,766,622,474,312,150];
  const POSES=['idle','walk-1','walk-2','walk-3','walk-4','wave'];
  const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let phase='loading', current=0, carFloor=FLOOR_Y[0], openness=1;
  const residents=PEOPLE.map(p=>{
    const el=document.createElement('div'); el.className='hero'; el.id=p.id;
    el.setAttribute('role','img');el.setAttribute('aria-label',p.name);el.hidden=true;
    el.style.width=el.style.height=p.size+'px';
    const frames=POSES.map((pose,i)=>{
      const img=new Image();img.alt='';img.draggable=false;img.hidden=i!==0;
      img.src=`./gitkeep/lift-${p.id}-${pose}-v${p.version}.png`;el.append(img);return img;
    });
    const shadow=document.createElement('div');shadow.className='heroShadow';shadow.hidden=true;shadow.setAttribute('aria-hidden','true');
    $('stage').append(shadow,el);
    const light=document.createElement('div');light.className='roomLight';light.style.top=(FLOOR_Y[p.floor-1]-115)+'px';light.setAttribute('aria-hidden','true');$('stage').append(light);
    return {...p,el,frames,shadow,light,x:165,y:FLOOR_Y[0],frame:0,settled:false};
  });
  const buttons=[];
  for(let f=6;f>=1;f--){
    const button=document.createElement('button');button.className='floorButton';button.style.top=`${245+(6-f)*100}px`;
    button.disabled=true;button.dataset.floor=f;button.setAttribute('aria-label',`Этаж ${f}`);
    const plate=document.createElement('div');plate.className='art';art(plate,'button');
    const digit=document.createElement('span');digit.textContent=f;button.append(plate,digit);
    button.addEventListener('click',()=>chooseFloor(f,button));$('buttons').append(button);buttons.push(button);
    const label=document.createElement('div');label.className='floorLabel';label.id='floor-'+f;label.textContent=f;label.style.top=`${FLOOR_Y[f-1]-95}px`;$('floorLabels').append(label);
  }
  let slide=1, hintOpened=false;
  const DELIVERIES=[
    {floor:5,hint:'Получатель живёт выше кота и ниже лисы, но не по соседству с котом.'},
    {floor:2,hint:'Получатель живёт ниже зайчика и выше ёжика, но не по соседству с зайчиком.'},
    {floor:6,hint:'Получатель живёт выше зайчика, но не по соседству с зайчиком.'},
    {floor:3,hint:'Получатель живёт выше медвежонка, но не выше зайчика. Получатель не сосед собаки.'},
    {floor:1,hint:'Получатель живёт ниже зайчика. Между этажами получателя и кота — ровно один этаж.'},
    {floor:4,hint:'Получатель живёт выше кота и ниже лисы, но не по соседству с лисой.'}
  ];
  const parcels=DELIVERIES.map(d=>{
    const el=document.createElement('div');el.className='parcel';el.hidden=true;el.setAttribute('role','img');el.setAttribute('aria-label','Посылка');
    const img=new Image();img.src='./gitkeep/lift-parcel-v1.png';img.alt='';el.append(img);$('stage').append(el);
    return {...d,el,x:170,y:FLOOR_Y[0]};
  });
  function announce(text){$('status').textContent=text;}
  function setPhase(value){phase=value;$('stage').dataset.phase=value;buttons.forEach(b=>b.disabled=value!=='ready'||!hintOpened);$('bulb').disabled=hintOpened||['loading','complete','resetting'].includes(value);}
  function frame(r,i){r.frames[r.frame].hidden=true;r.frames[i].hidden=false;r.frame=i;}
  function render(){
    for(const p of parcels)p.el.style.transform=`translate(${p.x}px, ${p.y-1109*76/1254}px)`;
    for(const r of residents){
      r.el.style.transform=`translate(${r.x}px, ${r.y-r.feet[r.frame]*r.size/1254}px)`;
      r.el.dataset.feetY=r.y;r.el.dataset.frame=r.frame;r.el.dataset.settled=String(r.settled);
      r.shadow.style.transform=`translate(${r.x+r.size*.28}px, ${r.y-3}px)`;
    }
    $('cabinBack').style.transform=$('cabinFront').style.transform=`translateY(${carFloor-124}px)`;
    $('leftDoor').style.transform=`translateX(${-100*openness}%)`;$('rightDoor').style.transform=`translateX(${100*openness}%)`;
  }
  function animate(ms,update,ease=t=>t){
    const duration=reducedMotion?Math.min(ms,500):ms;
    return new Promise(resolve=>{
      let elapsed=0,last=null;
      function tick(now){
        if(last!==null&&!document.hidden)elapsed+=Math.min(50,now-last);last=now;
        const t=duration===0?1:Math.min(1,elapsed/duration);update(ease(t));render();
        if(t<1)requestAnimationFrame(tick);else resolve();
      }
      requestAnimationFrame(tick);
    });
  }
  const smooth=t=>t*t*(3-2*t);
  async function doors(target){const start=openness;await animate(550,t=>openness=start+(target-start)*t,smooth);}
  async function ride(target,r=null){
    const start=carFloor;
    if(start===target)return;
    await animate(700+Math.abs(target-start)*3,t=>{carFloor=start+(target-start)*t;if(r)r.y=carFloor;},smooth);
  }
  async function walk(r,target,fade=false,onClear=null){
    const start=r.x,distance=target-start;
    await animate(Math.abs(distance)/r.speed*1000,t=>{
      r.x=start+distance*t;
      if(onClear&&r.x>=365){const cleared=onClear;onClear=null;cleared();}
      frame(r,reducedMotion?0:1+Math.floor(Math.abs(distance*t)/r.step)%4);
      if(fade)r.el.style.opacity=r.shadow.style.opacity=Math.min(1,t*5);
    });frame(r,0);render();
  }
  function showTask(){
    $('instruction').hidden=!hintOpened;$('intro').hidden=hintOpened;
    $('bulb').setAttribute('aria-expanded',String(hintOpened));
  }
  function hideHint(){ $('instruction').hidden=true; }
  $('bulb').addEventListener('click',()=>{
    if(hintOpened||['loading','complete','resetting'].includes(phase))return;
    hintOpened=true;showTask();setPhase(phase);
    $('hintTitle').setAttribute('tabindex','-1');$('hintTitle').focus({preventScroll:true});
  });
  async function enter(){
    const r=residents[current];setPhase('entering');$('stage').dataset.resident=r.id;
    $('hintTitle').textContent=`Где живёт ${r.name.toLowerCase()}?`;$('condition').textContent=r.hint;
    $('hintNumber').textContent=`ЖИТЕЛЬ ${current+1} ИЗ ${residents.length}`;
    $('progress').textContent=`ЛИФТ · ${current} ИЗ ${residents.length} ДОМА`;
    showTask();
    buttons.forEach(b=>{b.classList.remove('selected','shake');b.removeAttribute('aria-pressed');});
    r.x=165;r.y=FLOOR_Y[0];frame(r,0);r.el.hidden=r.shadow.hidden=false;r.el.style.opacity=r.shadow.style.opacity=0;r.el.classList.add('foreground');
    r.el.setAttribute('aria-label',`${r.name} входит в лифт`);announce(`${r.name} входит в лифт.`);render();
    await walk(r,239,true);r.el.classList.remove('foreground');setPhase('ready');
    r.el.setAttribute('aria-label',`${r.name} ждёт в лифте`);announce(`${r.name} ждёт. Нажми на лампочку и выбери этаж.`);
  }
  async function chooseFloor(f,button){
    if(phase!=='ready'||!hintOpened)return;
    if(slide===2){await deliver(f,button);return;}
    const r=residents[current];
    if(f!==r.floor){
      button.classList.remove('shake');void button.offsetWidth;button.classList.add('shake');announce('Посмотри подсказку ещё раз.');return;
    }
    setPhase('closing');button.classList.add('selected');button.setAttribute('aria-pressed','true');showTask();
    announce(`Верно! ${r.name} отправляется домой.`);
    await doors(0);setPhase('riding');await ride(FLOOR_Y[f-1],r);
    setPhase('opening');await doors(1);setPhase('exiting');r.el.classList.add('foreground');
    let returnTrip;
    await walk(r,540,false,()=>{returnTrip=returnLift();});r.settled=true;frame(r,5);r.light.style.opacity=1;$('floor-'+f).classList.add('occupied');
    r.el.setAttribute('aria-label',`${r.name} дома, этаж ${f}`);announce(`${r.name} дома!`);
    await returnTrip;
    frame(r,0);render();current++;
    if(current<residents.length)await enter();else finish();
  }
  function finish(){
    $('nextSlide').hidden=false;$('restart').hidden=true;
    setPhase('complete');hideHint();$('intro').hidden=true;$('success').hidden=false;$('restart').disabled=false;$('bulb').classList.remove('pulse');
    for(const r of residents){frame(r,5);r.light.style.opacity=1;}
    $('sparkles').hidden=false;render();announce('Дом заселён! Все шесть друзей нашли свои квартиры.');$('nextSlide').focus({preventScroll:true});
  }
  async function returnLift(){
    setPhase('returning');await doors(0);await ride(FLOOR_Y[0]);await doors(1);
  }
  async function moveParcel(p,target,fade=false,onClear=null){
    const origin=p.x;await animate(Math.abs(target-origin)/90*1000,t=>{p.x=origin+(target-origin)*t;if(onClear&&p.x>=365){const cleared=onClear;onClear=null;cleared();}if(fade)p.el.style.opacity=Math.min(1,t*5);});
  }
  async function nextParcel(){
    const p=parcels[current];setPhase('entering');$('stage').dataset.resident='parcel-'+(current+1);
    $('hintNumber').textContent=`ПОСЫЛКА ${current+1} ИЗ 6`;$('hintTitle').textContent='Кому посылка?';$('condition').textContent=p.hint;
    document.querySelector('#instruction .cardHint').textContent='Соседи живут этажом выше или ниже.';showTask();
    buttons.forEach(b=>{b.classList.remove('selected','shake');b.removeAttribute('aria-pressed');});
    p.x=165;p.y=FLOOR_Y[0];p.el.hidden=false;p.el.style.opacity=0;p.el.classList.add('foreground');
    await moveParcel(p,255,true);p.el.classList.remove('foreground');setPhase('ready');announce('Прочитай условие и выбери этаж для посылки.');
  }
  async function deliver(f,button){
    const p=parcels[current];
    if(f!==p.floor){button.classList.remove('shake');void button.offsetWidth;button.classList.add('shake');announce('Посмотри условие ещё раз.');return;}
    setPhase('closing');button.classList.add('selected');await doors(0);setPhase('riding');await ride(FLOOR_Y[f-1],p);
    setPhase('opening');await doors(1);setPhase('exiting');p.el.classList.add('foreground');
    let returnTrip;
    await moveParcel(p,665,false,()=>{returnTrip=returnLift();});
    p.el.setAttribute('aria-label',`Посылка доставлена, этаж ${f}`);p.el.dataset.delivered='true';
    const recipient=residents.find(r=>r.floor===f);frame(recipient,5);render();
    await returnTrip;frame(recipient,0);current++;
    if(current<parcels.length){await nextParcel();return;}
    setPhase('complete');hideHint();$('success').hidden=false;$('successTitle').textContent='Все посылки доставлены!';
    document.querySelector('#success .condition').textContent='Каждый житель получил свою посылку.';
    $('nextSlide').hidden=true;$('restart').hidden=false;$('restart').disabled=false;$('sparkles').hidden=false;
    residents.forEach(r=>frame(r,5));render();announce('Все посылки доставлены!');$('restart').focus({preventScroll:true});
  }
  $('nextSlide').addEventListener('click',async()=>{
    if(phase!=='complete'||slide!==1)return;
    slide=2;current=0;$('stage').dataset.slide='2';$('success').hidden=true;$('sparkles').hidden=true;
    residents.forEach(r=>frame(r,0));await nextParcel();
  });
  for(let i=0;i<18;i++){
    const star=document.createElement('span');star.className='sparkle';star.textContent='✦';star.style.left=(455+(i%3)*155)+'px';star.style.top=(FLOOR_Y[Math.floor(i/3)]-100-(i%3)*12)+'px';star.style.animationDelay=(i%4)*.2+'s';$('sparkles').append(star);
  }
  async function start(){
    if(phase!=='loading'&&phase!=='complete')return;
    setPhase('resetting');$('restart').disabled=true;$('success').hidden=true;$('sparkles').hidden=true;hideHint();
    if(current>0)await animate(250,t=>residents.forEach(r=>r.el.style.opacity=r.shadow.style.opacity=1-t));
    for(const r of residents){r.el.hidden=r.shadow.hidden=true;r.light.style.opacity=0;r.settled=false;frame(r,0);}
    document.querySelectorAll('.floorLabel').forEach(el=>el.classList.remove('occupied'));
    slide=1;$('stage').dataset.slide='1';
    parcels.forEach(p=>{p.el.hidden=true;delete p.el.dataset.delivered;});
    $('successTitle').textContent='Дом заселён!';document.querySelector('#success .condition').textContent='Все шесть друзей нашли свои квартиры!';
    document.querySelector('#instruction .cardHint').textContent='Выбери кнопку нужного этажа.';
    current=0;carFloor=FLOOR_Y[0];openness=1;await enter();
  }
  $('restart').addEventListener('click',start);$('retry').addEventListener('click',()=>location.reload());
  function resize(){const rect=$('viewport').getBoundingClientRect();$('stage').style.transform=`translate(-50%, -50%) scale(${Math.min(rect.width/1672,rect.height/940.5)})`;}
  new ResizeObserver(resize).observe($('viewport'));resize();render();
  async function preload(){
    const missing=[];
    await Promise.all([...document.images].map(img=>new Promise(resolve=>{
      let timer;
      const done=ok=>{clearTimeout(timer);img.removeEventListener('load',loaded);img.removeEventListener('error',failed);if(!ok)missing.push(new URL(img.src).pathname.split('/').slice(-2).join('/'));resolve();};
      const loaded=()=>done(true),failed=()=>done(false);
      if(img.complete){done(img.naturalWidth>0);return;}
      img.addEventListener('load',loaded,{once:true});img.addEventListener('error',failed,{once:true});timer=setTimeout(failed,45000);
    })));
    if(missing.length){$('loadTitle').textContent='Не удалось загрузить картинки';$('loadDetails').textContent='Проверьте файлы: '+[...new Set(missing)].join(', ');$('retry').hidden=false;return;}
    $('loading').hidden=true;await start();
  }
  preload();
})();

</script>
</body>
</html>
